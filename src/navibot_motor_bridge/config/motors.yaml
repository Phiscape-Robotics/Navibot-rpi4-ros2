/motor_bridge:
  ros__parameters:
    port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    baudrate: 9600
    front_address: 1
    rear_address: 2
    # Total transactions/sec; each Nano receives half this rate.
    poll_rate: 20.0
    reply_timeout: 0.04
    command_timeout: 0.25
    feedback_timeout: 0.25
    max_rpm: 135.0
